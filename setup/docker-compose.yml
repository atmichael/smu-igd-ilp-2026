version: '3.8'

services:
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: mysql8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Pass123#
      MYSQL_DATABASE: ilpdvapp
      MYSQL_USER: ilpuser
      MYSQL_PASSWORD: Pass123#
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: